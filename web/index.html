<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayam Jago Labirin — Live Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div class="title-group">
        <h1>AYAM JAGO LABIRIN</h1>
        <span class="badge">Java OOP → Web Demo</span>
      </div>
      <div class="actions">
        <button id="restartBtn" class="btn" type="button">↺ Restart</button>
        <a class="btn btn-secondary" href="https://github.com/faridahmadnr/PPBO-AyamJago" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="gameCanvas" width="850" height="810" tabindex="0" aria-label="Ayam Jago Labirin Game Canvas"></canvas>
    </div>

    <footer class="controls-bar">
      <div class="control-pill"><strong>Move (2x / Turn):</strong> <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <div class="control-pill"><strong>Attack:</strong> Walk into Enemy</div>
      <div class="control-pill"><strong>Heal (+3 HP):</strong> Collect Corn</div>
      <div class="control-pill"><strong>Restart:</strong> <kbd>R</kbd></div>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
